<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7C2D12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Minimal circles -->
  <circle cx="1060" cy="70" r="120" fill="#FDBA74" opacity="0.18"/>
  <circle cx="120" cy="290" r="90" fill="#FED7AA" opacity="0.55"/>

  <!-- Main card -->
  <rect x="90" y="60" width="1020" height="220" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Accent line -->
  <rect x="130" y="98" width="70" height="5" rx="3" fill="url(#accent)"/>

  <!-- Label -->
  <text x="130" y="130"
        font-family="Inter, Arial, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="3"
        fill="#C2410C">
    PORTFOLIO
  </text>

  <!-- Name -->
  <text x="130" y="185"
        font-family="Inter, Arial, sans-serif"
        font-size="58"
        font-weight="800"
        fill="#1F2937">
    Genius
  </text>

  <!-- Subtitle -->
  <text x="130" y="220"
        font-family="Inter, Arial, sans-serif"
        font-size="22"
        font-weight="500"
        fill="#7C2D12">
    Anmanya Khongmee · Student Developer
  </text>

  <!-- Description -->
  <text x="130" y="252"
        font-family="Inter, Arial, sans-serif"
        font-size="16"
        font-weight="400"
        fill="#6B7280">
    Digital Industry Integration · CAMT, Chiang Mai University
  </text>

  <!-- Right section -->
  <g transform="translate(800 105)">
    <text x="0" y="0"
          font-family="Inter, Arial, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="2.5"
          fill="#C2410C">
      FOCUS
    </text>

    <text x="0" y="40"
          font-family="Inter, Arial, sans-serif"
          font-size="28"
          font-weight="800"
          fill="#1F2937">
      Web Development
    </text>

    <text x="0" y="72"
          font-family="Inter, Arial, sans-serif"
          font-size="16"
          font-weight="400"
          fill="#6B7280">
      UI Design · Frontend · Digital Solutions
    </text>

    <rect x="0" y="96" width="180" height="3" rx="3" fill="url(#accent)"/>
  </g>

  <!-- Footer -->
  <text x="1070" y="302"
        font-family="Inter, Arial, sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="2"
        fill="#9CA3AF"
        text-anchor="end">
    CLEAN · SIMPLE · PROFESSIONAL
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="35%" stop-color="#FFDAB9"/>
      <stop offset="70%" stop-color="#FFB088"/>
      <stop offset="100%" stop-color="#E89668"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </radialGradient>
    <symbol id="cloudShape" viewBox="0 0 120 60">
      <ellipse cx="30" cy="40" rx="22" ry="18" fill="url(#cloud)"/>
      <ellipse cx="55" cy="32" rx="28" ry="22" fill="url(#cloud)"/>
      <ellipse cx="85" cy="40" rx="22" ry="18" fill="url(#cloud)"/>
      <ellipse cx="100" cy="42" rx="14" ry="12" fill="url(#cloud)"/>
    </symbol>
    <symbol id="pixStar" viewBox="0 0 12 12">

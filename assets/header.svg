      <circle cx="16" cy="10" r="3.5" fill="#FED7AA"/>
      <circle cx="10" cy="16" r="3.5" fill="#FED7AA"/>
      <circle cx="4" cy="10" r="3.5" fill="#FED7AA"/>
      <circle cx="10" cy="10" r="3" fill="#FCD34D"/>
    </symbol>
    <symbol id="croissant" viewBox="0 0 30 20">
      <path d="M5 14 Q3 10 6 7 Q10 4 15 5 Q20 4 24 7 Q27 10 25 14 Q22 17 15 16 Q8 17 5 14 Z" fill="#D97706" stroke="#92400E" stroke-width="1"/>

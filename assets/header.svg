<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Soft pastel sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0F0"/>
      <stop offset="40%" stop-color="#FFD0EC"/>
      <stop offset="75%" stop-color="#E0C8FF"/>
      <stop offset="100%" stop-color="#C8D8FF"/>
    </linearGradient>

    <!-- Cloud gradient -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE8F6" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cloud shape -->
    <symbol id="cloudShape" viewBox="0 0 120 60">
      <ellipse cx="30" cy="40" rx="22" ry="18" fill="url(#cloud)"/>
      <ellipse cx="55" cy="32" rx="28" ry="22" fill="url(#cloud)"/>
      <ellipse cx="85" cy="40" rx="22" ry="18" fill="url(#cloud)"/>
      <ellipse cx="100" cy="42" rx="14" ry="12" fill="url(#cloud)"/>
    </symbol>

    <!-- Pixel star -->
    <symbol id="pixStar" viewBox="0 0 12 12">
      <rect x="5" y="0" width="2" height="2" fill="#FDE68A"/>
      <rect x="5" y="10" width="2" height="2" fill="#FDE68A"/>
      <rect x="0" y="5" width="2" height="2" fill="#FDE68A"/>
      <rect x="10" y="5" width="2" height="2" fill="#FDE68A"/>
      <rect x="4" y="4" width="4" height="4" fill="#FFFBEB"/>
    </symbol>

    <!-- Tiny heart -->
    <symbol id="heart" viewBox="0 0 14 14">
      <path d="M7 12 L1.5 6.5 C-0.5 4 1 1 3.5 1 C5 1 6.5 2 7 3 C7.5 2 9 1 10.5 1 C13 1 14.5 4 12.5 6.5 Z" fill="#F472B6"/>
    </symbol>

    <!-- Sparkle -->
    <symbol id="sparkle" viewBox="0 0 16 16">
      <path d="M8 0 L9 6 L15 8 L9 9 L8 15 L7 9 L1 8 L7 6 Z" fill="#FFFFFF" opacity="0.9"/>
    </symbol>

    <!-- Pink flower -->
    <symbol id="flower" viewBox="0 0 20 20">
      <circle cx="10" cy="4" r="3.5" fill="#FBCFE8"/>
      <circle cx="16" cy="10" r="3.5" fill="#FBCFE8"/>
      <circle cx="10" cy="16" r="3.5" fill="#FBCFE8"/>
      <circle cx="4" cy="10" r="3.5" fill="#FBCFE8"/>
      <circle cx="10" cy="10" r="3" fill="#FDE68A"/>
    </symbol>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- TWINKLING PIXEL STARS -->
  <g>
    <use href="#pixStar" x="80" y="30" width="14" height="14">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="220" y="55" width="10" height="10">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="350" y="25" width="12" height="12">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="900" y="35" width="14" height="14">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="1050" y="60" width="10" height="10">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="1130" y="30" width="12" height="12">
      <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="500" y="45" width="9" height="9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </use>
    <use href="#pixStar" x="750" y="50" width="11" height="11">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- MOVING CLOUDS (back layer, slower) -->
  <g opacity="0.85">
    <use href="#cloudShape" x="-150" y="40" width="180" height="90">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1400 0" dur="40s" repeatCount="indefinite"/>
    </use>
    <use href="#cloudShape" x="-400" y="90" width="150" height="75">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1700 0" dur="50s" repeatCount="indefinite"/>
    </use>
    <use href="#cloudShape" x="-700" y="20" width="200" height="100">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2000 0" dur="60s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- FLOATING SPARKLES -->
  <g>
    <use href="#sparkle" x="100" y="140" width="12" height="12">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="1080" y="160" width="14" height="14">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20; 0 0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="200" y="200" width="10" height="10">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="980" y="210" width="11" height="11">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- FLOATING HEARTS (rising) -->
  <g>
    <use href="#heart" x="150" y="280" width="16" height="16">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -250" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
    </use>
    <use href="#heart" x="1020" y="280" width="14" height="14">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -260" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" begin="2s" repeatCount="indefinite"/>
    </use>
    <use href="#heart" x="80" y="280" width="12" height="12">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -240" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </use>
    <use href="#heart" x="1110" y="280" width="15" height="15">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -270" dur="11s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="11s" begin="1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- FLOWERS in corners -->
  <use href="#flower" x="40" y="240" width="32" height="32">
    <animateTransform attributeName="transform" type="rotate" values="0 56 256; 360 56 256" dur="20s" repeatCount="indefinite"/>
  </use>
  <use href="#flower" x="1130" y="240" width="32" height="32">
    <animateTransform attributeName="transform" type="rotate" values="0 1146 256; -360 1146 256" dur="22s" repeatCount="indefinite"/>
  </use>

  <!-- ===== KAWAII GHOST CHARACTER (left) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3s" repeatCount="indefinite"/>
    <!-- body -->
    <path d="M 140 200 Q 140 165 175 165 Q 210 165 210 200 L 210 245 Q 205 250 200 245 Q 195 250 190 245 Q 185 250 180 245 Q 175 250 170 245 Q 165 250 160 245 Q 155 250 150 245 Q 145 250 140 245 Z" fill="#FFFFFF" stroke="#F472B6" stroke-width="2.5" filter="url(#softGlow)"/>
    <!-- cheeks -->
    <circle cx="158" cy="210" r="5" fill="#FBCFE8" opacity="0.85"/>
    <circle cx="192" cy="210" r="5" fill="#FBCFE8" opacity="0.85"/>
    <!-- eyes -->
    <ellipse cx="165" cy="200" rx="2.5" ry="3.5" fill="#1F2937"/>
    <ellipse cx="185" cy="200" rx="2.5" ry="3.5" fill="#1F2937"/>
    <circle cx="165.8" cy="199" r="0.8" fill="#FFFFFF"/>
    <circle cx="185.8" cy="199" r="0.8" fill="#FFFFFF"/>
    <!-- mouth -->
    <path d="M 172 213 Q 175 217 178 213" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- little bow -->
    <path d="M 175 165 L 168 159 L 168 169 Z" fill="#F472B6"/>
    <path d="M 175 165 L 182 159 L 182 169 Z" fill="#F472B6"/>
    <circle cx="175" cy="165" r="2" fill="#EC4899"/>
  </g>

  <!-- ===== KAWAII CAT CHARACTER (right) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.5s" repeatCount="indefinite"/>
    <!-- body -->
    <ellipse cx="1025" cy="225" rx="40" ry="35" fill="#FFE4F1" stroke="#F472B6" stroke-width="2.5" filter="url(#softGlow)"/>
    <!-- ears -->
    <path d="M 995 200 L 988 178 L 1010 192 Z" fill="#FFE4F1" stroke="#F472B6" stroke-width="2.5"/>
    <path d="M 1055 200 L 1062 178 L 1040 192 Z" fill="#FFE4F1" stroke="#F472B6" stroke-width="2.5"/>
    <path d="M 996 198 L 992 185 L 1004 192 Z" fill="#FBCFE8"/>
    <path d="M 1054 198 L 1058 185 L 1046 192 Z" fill="#FBCFE8"/>
    <!-- cheeks -->
    <circle cx="1005" cy="232" r="5" fill="#F9A8D4" opacity="0.8"/>
    <circle cx="1045" cy="232" r="5" fill="#F9A8D4" opacity="0.8"/>
    <!-- eyes (closed happy) -->
    <path d="M 1013 220 Q 1017 215 1021 220" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 1029 220 Q 1033 215 1037 220" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- mouth -->
    <path d="M 1022 228 Q 1025 232 1028 228" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- tail -->
    <path d="M 1063 230 Q 1085 225 1080 205 Q 1078 195 1085 192" stroke="#F472B6" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M 1063 230 Q 1085 225 1080 205 Q 1078 195 1085 192; M 1063 230 Q 1085 232 1090 215 Q 1092 200 1095 196; M 1063 230 Q 1085 225 1080 205 Q 1078 195 1085 192" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== MAIN TITLE ===== -->
  <g filter="url(#softGlow)">
    <text x="600" y="148" font-family="'Quicksand', 'Comic Sans MS', sans-serif" font-size="62" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="2">
      ✿ Genius World ✿
    </text>
  </g>

  <!-- subtitle -->
  <text x="600" y="190" font-family="'Quicksand', sans-serif" font-size="20" font-weight="600" fill="#9333EA" text-anchor="middle" opacity="0.85" letter-spacing="3">
    Anmanya Khongmee ・ Student Developer ・ DII @ CAMT, CMU
  </text>

  <!-- decorative line -->
  <line x1="450" y1="210" x2="750" y2="210" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- bottom tagline -->
  <text x="600" y="240" font-family="'Quicksand', sans-serif" font-size="15" font-weight="500" fill="#7C3AED" text-anchor="middle" opacity="0.75" letter-spacing="2">
    ♡ Welcome to my Kawaii Coding World ♡
  </text>

  <!-- pixel ground dots (cute decoration) -->
  <g fill="#F9A8D4" opacity="0.5">
    <rect x="280" y="285" width="4" height="4"/>
    <rect x="320" y="290" width="4" height="4"/>
    <rect x="360" y="285" width="4" height="4"/>
    <rect x="400" y="288" width="4" height="4"/>
    <rect x="440" y="285" width="4" height="4"/>
    <rect x="800" y="285" width="4" height="4"/>
    <rect x="840" y="288" width="4" height="4"/>
    <rect x="880" y="285" width="4" height="4"/>
    <rect x="920" y="290" width="4" height="4"/>
  </g>
</svg>

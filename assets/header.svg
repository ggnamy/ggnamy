      <rect x="5" y="10" width="2" height="2" fill="#FEF3C7"/>
      <rect x="0" y="5" width="2" height="2" fill="#FEF3C7"/>
      <rect x="10" y="5" width="2" height="2" fill="#FEF3C7"/>
      <rect x="4" y="4" width="4" height="4" fill="#FFFBEB"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 14 14">
      <path d="M7 12 L1.5 6.5 C-0.5 4 1 1 3.5 1 C5 1 6.5 2 7 3 C7.5 2 9 1 10.5 1 C13 1 14.5 4 12.5 6.5 Z" fill="#EA580C"/>
